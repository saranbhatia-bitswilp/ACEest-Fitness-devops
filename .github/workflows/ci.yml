name: ACEest Fitness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build and syntax validation
        run: |
          python -m py_compile app.py test_app.py

      - name: Run Pytest on runner
        run: |
          python -m pytest -v test_app.py

      - name: Build Docker image
        run: |
          docker build -t aceest-fitness:ci .

      - name: Run Pytest inside Docker container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app:ro" \
            -w /app \
            aceest-fitness:ci \
            python -m pytest -v -p no:cacheprovider test_app.py
